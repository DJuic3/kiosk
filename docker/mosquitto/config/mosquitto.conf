# Local stand-in for company MQTT server (dev only).
# Allows connections from the LAN so a real vending PC can reach this broker.

listener 1883 0.0.0.0
allow_anonymous true
protocol mqtt

# Browser UI connects here (Machine Control page)
listener 9001 0.0.0.0
allow_anonymous true
protocol websockets

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
