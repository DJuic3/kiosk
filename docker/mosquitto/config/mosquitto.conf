# LAN MQTT broker (company-server stand-in on this Mac).
# Machines:  mqtt://192.168.22.225:1883  (anonymous for local lab)
# Browser:   ws://192.168.22.225:9001

# ---- Plain MQTT (machines / mosquitto_pub / SDK) ----
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous true

# ---- WebSocket MQTT (Angular Machine Control / kiosk) ----
listener 9001 0.0.0.0
protocol websockets
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
