# Company-server simulation on your Mac.
# Mosquitto = central MQTT broker that vending-sdk machines connect to.
#
# Start:  docker compose up -d
# Stop:   docker compose down

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: vending-mqtt
    restart: unless-stopped
    ports:
      # Published on your Mac so the vending PC can use <your-mac-lan-ip>:1883
      - "1883:1883"
      # WebSocket for Angular Machine Control UI
      - "9001:9001"
    volumes:
      # Whole config dir so mosquitto.conf + passwd are both available
      - ./docker/mosquitto/config:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

volumes:
  mosquitto-data:
  mosquitto-log:
